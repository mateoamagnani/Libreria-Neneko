<!DOCTYPE html>
<html lang="es-AR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Página no encontrada — Librería Neneko</title>
  <meta name="robots" content="noindex">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
      padding: 20px;
    }
    .container {
      text-align: center;
      max-width: 500px;
    }
    .code {
      font-size: 5em;
      font-weight: 700;
      color: #3f7575;
      line-height: 1;
      margin-bottom: 10px;
    }
    h1 {
      font-size: 2em;
      color: #333;
      margin-bottom: 15px;
    }
    p {
      color: #666;
      margin-bottom: 30px;
      font-size: 1.1em;
    }
    .cta-group {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: 40px;
    }
    a {
      display: inline-block;
      padding: 12px 24px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 500;
      transition: all 0.3s ease;
    }
    .btn-primary {
      background: #3f7575;
      color: white;
    }
    .btn-primary:hover {
      background: #2d5a5a;
    }
    .btn-secondary {
      background: white;
      color: #3f7575;
      border: 2px solid #3f7575;
    }
    .btn-secondary:hover {
      background: #f8f9fa;
    }
    .emoji {
      font-size: 4em;
      margin-bottom: 20px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="emoji">🔍</div>
    <div class="code">404</div>
    <h1>Página no encontrada</h1>
    <p>Parece que este link no existe o cambió de lugar.</p>

    <div class="cta-group">
      <a href="/" class="btn-primary">Volver al inicio</a>
      <a href="https://wa.me/5491161691209" target="_blank" rel="noopener" class="btn-secondary">Pedir por WhatsApp</a>
    </div>

    <p style="font-size: 0.95em; color: #999;">
      Si creés que esto es un error, escribinos por WhatsApp: <strong>+54 9 11 6169-1209</strong>
    </p>
  </div>
</body>
</html>
